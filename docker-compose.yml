services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OMP_NUM_THREADS=1
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
